<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Brand Orb</title>
<!--
  The sandboxed host for one orb. Loaded into an allow-scripts-only iframe by
  js/brand-orbs.js, one canvas per frame, so the engine only ever allocates a
  single render loop. The authored package builds this same document as a
  srcDoc string; a real file is used here instead so the 82KB engine is
  fetched and cached once rather than carried inside every page's JavaScript.
-->
<style>
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#050608; }
  body { display:grid; place-items:center; }
  canvas { display:block; }
</style>
<script>
/* The authored speed and pause controls. This virtualises performance.now so
   the engine's own clock can be slowed or frozen without it knowing, and it
   has to run before the engine reads the clock for the first time. */
(function () {
  var nativeNow = performance.now.bind(performance);
  var last = nativeNow();
  var virtual = last;
  var controls = { speed: 1, paused: false };
  window.__BRAND_ORB_PAUSED = false;
  performance.now = function () {
    var real = nativeNow();
    if (!controls.paused) virtual += (real - last) * controls.speed;
    last = real;
    return virtual;
  };
  window.addEventListener('message', function (event) {
    if (!event.data || event.data.type !== 'brand-orbs-controls') return;
    var next = event.data.controls || {};
    if (Number.isFinite(next.speed)) controls.speed = Math.max(.1, Math.min(3, next.speed));
    controls.paused = Boolean(next.paused);
    window.__BRAND_ORB_PAUSED = controls.paused;
  });
})();
</script>
</head>
<body>
<canvas aria-hidden="true"></canvas>
<script>
/* Reads the orb off the query string and sets the canvas up the way the
   authored specimen document does, before the engine boots and goes looking
   for canvases to claim. */
(function () {
  var VARIANTS = ["claude","openai","codex","cursor","gemini","figma","framer","react",
    "swift","designcode","aura","dreamcut","ui","ux","css","ios","neuform","github",
    "x","instagram","threads","linkedin","email"];
  var q = new URLSearchParams(location.search);
  var variant = q.get('variant');
  if (VARIANTS.indexOf(variant) < 0) variant = 'claude';
  var size = q.get('size') === 'small' ? 20 : 56;
  var light = q.get('mode') === 'light';

  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  var bg = light ? '#dad7cc' : '#050608';
  document.documentElement.style.background = bg;
  document.body.style.background = bg;

  var c = document.querySelector('canvas');
  c.dataset.mode = variant;
  c.dataset.size = String(size);
  c.style.width  = size + 'px';
  c.style.height = size + 'px';
  /* the authored light treatment: the engine only draws a dark-mode orb */
  c.style.filter = light ? 'invert(1) hue-rotate(180deg) contrast(1.04) saturate(.92)' : 'none';
})();
</script>
<script src="engine.js"></script>
</body>
</html>
