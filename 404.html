<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, follow"/>
<meta name="theme-color" content="#080808"/>
<link rel="icon" type="image/png" href="/assets/images/favicon.png"/>
<link rel="apple-touch-icon" href="/assets/images/favicon.png"/>
<title>Not Found · Rahul Kuttappy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/css/style.css?v=20260916j"/>
<style>
  /* Absolute asset paths above, because a 404 can be served at any depth */
  #nf{
    min-height:100svh;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2rem;padding:6rem 1.5rem;text-align:center;
  }
  #nf::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(70% 60% at 50% 100%,rgba(var(--red-glow),.22) 0%,transparent 62%),
      repeating-linear-gradient(to bottom,rgba(237,234,226,.022) 0px,rgba(237,234,226,.022) 1px,transparent 1px,transparent 4px);
  }
  .nf-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1.6rem;}
  .nf-code{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(5rem,20vw,14rem);line-height:.82;letter-spacing:.02em;color:var(--off);
  }
  .nf-msg{
    font-family:'JetBrains Mono',monospace;font-size:.74rem;line-height:2;
    letter-spacing:.02em;color:rgba(237,234,226,.6);max-width:44ch;
  }
  .nf-links{display:flex;gap:1.6rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem;}
  .nf-links a{
    font-family:'JetBrains Mono',monospace;font-size:.54rem;font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;color:var(--off);text-decoration:none;
    padding:.7rem 1.1rem;border:1px solid rgba(237,234,226,.22);border-radius:2px;cursor:none;
    transition:border-color .3s ease,background .3s ease;
  }
  .nf-links a:hover{border-color:var(--red);background:rgba(var(--red-glow),.18);}
  .nf-mark{height:18px;width:auto;opacity:.5;}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<canvas id="cursorFX" aria-hidden="true"></canvas>

<section id="nf">
  <div class="nf-inner">
    <img class="nf-mark" src="/assets/images/logo.png" alt="RK"/>
    <p class="s-eye">Signal Lost</p>
    <h1 class="nf-code"><span class="dither-word" data-dither>404</span></h1>
    <p class="nf-msg">This frame did not make the cut. The page you were after has either moved or never existed.</p>
    <div class="nf-links">
      <a href="/">Home</a>
      <a href="/index.html#works">Works</a>
      <a href="/films.html">Films</a>
      <a href="/garage.html">Garage</a>
    </div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="/js/main.js?v=20260916j"></script>
</body>
</html>
