<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hero → Works transition</title>
<!-- Local scratch page. Not linked, not in the sitemap.
     A prototype of pushing through the hero frame into Selected Works.
     Scroll slowly. Nothing here touches the real homepage. -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root{--red:#7A1B18;--off:#EDEAE2;--muted:#5a5652;--border:rgba(237,234,226,.1);--bg:#080808;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--off);font-family:'Inter',system-ui,sans-serif;}

  .hint{position:fixed;left:50%;bottom:1.1rem;transform:translateX(-50%);z-index:60;
        font-family:'JetBrains Mono',monospace;font-size:.46rem;letter-spacing:.22em;
        text-transform:uppercase;color:rgba(237,234,226,.34);pointer-events:none;}
  .readout{position:fixed;left:1.1rem;bottom:1.1rem;z-index:60;
        font-family:'JetBrains Mono',monospace;font-size:.46rem;letter-spacing:.14em;
        color:rgba(237,234,226,.3);pointer-events:none;}

  /* the scroll distance the transition is scrubbed across */
  .stage{height:260vh;position:relative;}
  .viewport{position:sticky;top:0;height:100vh;overflow:hidden;}

  /* ── hero layer ── */
  .hero{position:absolute;inset:0;z-index:1;}
  .hero-bg{position:absolute;inset:0;}
  .hero-bg img{width:100%;height:100%;object-fit:cover;object-position:60% center;filter:brightness(.82);}
  .hero-bg::after{content:'';position:absolute;inset:0;
    background:linear-gradient(to right,rgba(8,8,8,.72) 0%,rgba(8,8,8,.3) 48%,rgba(8,8,8,.12) 100%);}
  .hero-inner{position:absolute;z-index:2;overflow:hidden;
    left:var(--px);right:var(--px);top:var(--pt);bottom:var(--pb);padding:2rem 2.4rem;
    display:flex;flex-direction:column;justify-content:center;
    background:linear-gradient(105deg,rgba(6,6,6,.72) 0%,rgba(6,6,6,.5) 42%,rgba(6,6,6,.12) 78%,transparent 100%);}
  .viewport{--px:16%;--pt:24%;--pb:18%;}
  .stamp{font-family:'JetBrains Mono',monospace;font-size:.46rem;font-weight:700;
         letter-spacing:.24em;text-transform:uppercase;color:rgba(237,234,226,.5);margin:0 0 .9rem;}
  .name{font-family:'Geist',sans-serif;font-weight:600;font-size:clamp(2.6rem,7.4vw,7.2rem);
        line-height:.88;letter-spacing:-.052em;display:flex;flex-direction:column;gap:.135em;}
  .name .b{color:var(--red);}
  .rule{width:2.5rem;height:2px;background:var(--red);margin:1.3rem 0;}
  .bio{font-family:'JetBrains Mono',monospace;font-size:clamp(.66rem,.82vw,.78rem);
       line-height:1.95;letter-spacing:.08em;text-transform:uppercase;
       color:rgba(237,234,226,.42);max-width:44ch;margin:0;}

  /* ── the frame: four hairlines and four dots, as on the real hero ── */
  .grid{position:absolute;inset:0;z-index:4;pointer-events:none;}
  .grid i{position:absolute;background:rgba(237,234,226,.13);}
  .hg-l{top:0;bottom:0;width:1px;left:var(--px);}
  .hg-r{top:0;bottom:0;width:1px;right:var(--px);}
  .hg-t{left:0;right:0;height:1px;top:var(--pt);}
  .hg-b{left:0;right:0;height:1px;bottom:var(--pb);}
  .dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--off);}
  .d-tl{left:var(--px);top:var(--pt);margin:-2.5px 0 0 -2.5px;}
  .d-tr{right:var(--px);top:var(--pt);margin:-2.5px -2.5px 0 0;}
  .d-bl{left:var(--px);bottom:var(--pb);margin:0 0 -2.5px -2.5px;}
  .d-br{right:var(--px);bottom:var(--pb);margin:0 -2.5px -2.5px 0;}
  .trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;}

  /* ── works layer: revealed through the frame ── */
  .works{position:absolute;inset:0;z-index:5;background:var(--bg);
         display:flex;flex-direction:column;justify-content:center;
         padding:4rem 2.5rem;will-change:clip-path;}
  .works-in{will-change:transform;}
  .w-eye{font-family:'JetBrains Mono',monospace;font-size:.5rem;font-weight:700;
         letter-spacing:.24em;text-transform:uppercase;color:var(--red);margin:0 0 .5rem;}
  .w-hed{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,5vw,4rem);
         letter-spacing:.05em;margin:0 0 1.8rem;}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;}
  .card{position:relative;aspect-ratio:4/3;overflow:hidden;border:1px solid var(--border);}
  .card img{width:100%;height:100%;object-fit:cover;filter:grayscale(.3) brightness(.8);}
  .card span{position:absolute;left:.7rem;bottom:.6rem;font-family:'JetBrains Mono',monospace;
             font-size:.46rem;letter-spacing:.18em;text-transform:uppercase;}
  .after{padding:6rem 2.5rem;border-top:1px solid var(--border);}
  .after p{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.16em;
           text-transform:uppercase;color:var(--muted);}
  @media(max-width:860px){ .cards{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>

<div class="stage">
  <div class="viewport">

    <div class="hero">
      <div class="hero-bg"><img src="assets/images/hero-poster.jpg" alt=""/></div>
      <div class="hero-inner" id="panel">
        <p class="stamp">(Aspiring Filmmaker — Visual Storyteller)</p>
        <div class="name"><span>RAHUL</span><span class="b">KUTTAPPY</span></div>
        <div class="rule"></div>
        <p class="bio">I chase the moment just before something breaks, and hold it still long enough to feel it.</p>
      </div>
    </div>

    <canvas class="trail" id="trail"></canvas>

    <div class="grid" id="grid" aria-hidden="true">
      <i class="hg-t"></i><i class="hg-r"></i><i class="hg-b"></i><i class="hg-l"></i>
      <span class="dot d-tl"></span><span class="dot d-tr"></span>
      <span class="dot d-bl"></span><span class="dot d-br"></span>
    </div>

    <div class="works" id="works">
      <div class="works-in" id="worksIn">
        <p class="w-eye">Selected</p>
        <h2 class="w-hed">WORKS</h2>
        <div class="cards">
          <a class="card"><img src="assets/images/projects/eilin.jpg" alt=""/><span>Gala Night</span></a>
          <a class="card"><img src="assets/images/projects/ards.jpg" alt=""/><span>ARDS</span></a>
          <a class="card"><img src="assets/images/projects/amg-sl-roadster.jpg" alt=""/><span>AMG SL</span></a>
          <a class="card"><img src="assets/images/projects/pearl-noir.jpg" alt=""/><span>Pearl Noir</span></a>
          <a class="card"><img src="assets/images/projects/knari-ss24.jpg" alt=""/><span>Knari</span></a>
          <a class="card"><img src="assets/images/projects/joe-oringel.jpg" alt=""/><span>Miles</span></a>
        </div>
      </div>
    </div>

  </div>
</div>

<section class="after"><p>…and the page carries on from here</p></section>

<p class="hint">scroll</p>
<p class="readout" id="readout">progress 0.00</p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const lenis = new Lenis({lerp:.085});
lenis.on('scroll', ScrollTrigger.update);
gsap.ticker.add(t => lenis.raf(t*1000));
gsap.ticker.lagSmoothing(0);

const vp     = document.querySelector('.viewport');
const grid   = document.getElementById('grid');
const works  = document.getElementById('works');
const worksIn= document.getElementById('worksIn');
const panel  = document.getElementById('panel');
const readout= document.getElementById('readout');
const trail  = document.getElementById('trail');
const tctx   = trail.getContext('2d');

const dots  = [...grid.querySelectorAll('.dot')];              /* tl tr bl br */
const lines = ['.hg-t','.hg-r','.hg-b','.hg-l'].map(s => grid.querySelector(s));
const ENDS  = [[0,1],[1,3],[2,3],[0,2]];
const hist  = dots.map(()=>[]);
const TRAIL = 10;

let W=0,H=0,box=null,base=null,dpr=1;

function measure(){
  W = vp.clientWidth; H = vp.clientHeight;
  dpr = Math.min(2, devicePixelRatio||1);
  trail.width = Math.round(W*dpr); trail.height = Math.round(H*dpr);
  tctx.setTransform(dpr,0,0,dpr,0,0);
  tctx.lineCap='round'; tctx.lineJoin='round'; tctx.strokeStyle='rgb(237,234,226)';
  /* the frame's resting rectangle, read off the laid-out hairlines */
  const l = lines[3].offsetLeft, r = lines[1].offsetLeft, t = lines[0].offsetTop, b = lines[2].offsetTop;
  box = {l, r, t, b};
  base = lines.map((el,i)=>({
    cx: el.offsetLeft + el.offsetWidth/2,
    cy: el.offsetTop  + el.offsetHeight/2,
    len:(i%2) ? el.offsetHeight : el.offsetWidth,
    vert: !!(i%2)
  }));
}

/* the same idea as the hero's own painter: dots are the corners, the
   hairlines are the sides, all from one rectangle */
function paint(l,r,t,b){
  const pts = [{x:l,y:t},{x:r,y:t},{x:l,y:b},{x:r,y:b}];
  pts.forEach((p,i)=>{
    const home = {x: dots[i].offsetLeft + 2.5, y: dots[i].offsetTop + 2.5};
    gsap.set(dots[i], {x:p.x-home.x, y:p.y-home.y});
  });
  ENDS.forEach(([a,c],i)=>{
    const A=pts[a], B=pts[c], bs=base[i];
    const dx=B.x-A.x, dy=B.y-A.y, len=Math.sqrt(dx*dx+dy*dy);
    const o = {x:(A.x+B.x)/2-bs.cx, y:(A.y+B.y)/2-bs.cy,
               rotation: Math.atan2(dy,dx)*180/Math.PI - (bs.vert?90:0)};
    o[bs.vert?'scaleY':'scaleX'] = len/bs.len;
    gsap.set(lines[i], o);
  });
  return pts;
}

function drawTrails(pts){
  tctx.clearRect(0,0,W,H);
  pts.forEach((p,i)=>{
    const h = hist[i];
    h.unshift(p);
    if(h.length > TRAIL) h.pop();
    if(h.length < 2) return;
    const sp = Math.hypot(h[0].x-h[1].x, h[0].y-h[1].y);
    const lit = Math.min(1, sp/6);
    if(lit <= .01) return;
    for(let k=0;k<h.length-1;k++){
      const f = 1 - k/(h.length-1);
      const seg = Math.hypot(h[k].x-h[k+1].x, h[k].y-h[k+1].y);
      if(seg < .4) continue;
      tctx.globalAlpha = .5*lit*f*f;
      tctx.lineWidth = Math.max(.4, 4.2*f);
      tctx.beginPath();
      tctx.moveTo(h[k].x,h[k].y); tctx.lineTo(h[k+1].x,h[k+1].y);
      tctx.stroke();
    }
  });
  tctx.globalAlpha = 1;
}

const lerp = (a,b,k)=>a+(b-a)*k;

function apply(p){
  /* the frame opens from the title box out to the whole screen */
  const l = lerp(box.l, 0, p), r = lerp(box.r, W, p);
  const t = lerp(box.t, 0, p), b = lerp(box.b, H, p);
  const pts = paint(l,r,t,b);
  drawTrails(pts);

  /* works is revealed through that same rectangle, and settles out of a zoom */
  works.style.clipPath = `inset(${t}px ${W-r}px ${H-b}px ${l}px)`;
  worksIn.style.transform = `scale(${lerp(1.18, 1, p)})`;
  works.style.opacity = Math.min(1, p*3.2);

  /* and the hero pushes past you rather than sliding away */
  panel.style.transform = `scale(${lerp(1, 1.35, p)})`;
  panel.style.opacity = String(Math.max(0, 1 - p*1.9));

  /* the dots fade once the frame reaches the edges */
  gsap.set(dots, {opacity: p > .82 ? Math.max(0, 1-(p-.82)/.18) : 1});
  readout.textContent = 'progress ' + p.toFixed(2);
}

measure();
apply(0);

ScrollTrigger.create({
  trigger: '.stage',
  start: 'top top',
  end: 'bottom bottom',
  scrub: true,
  onUpdate: self => apply(self.progress)
});

let rt;
addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ measure(); ScrollTrigger.refresh(); }, 180); });
</script>
</body>
</html>
